name: CI

on:
  push:
    branches:
      - main
      - stage
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify committed runtime content asset
        run: npm run content:verify:web

      - name: Enforce content contract on pull requests
        if: github.event_name == 'pull_request'
        run: npm run content:check-contract -- origin/${{ github.base_ref }} HEAD

      - name: Enforce content contract on pushes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npm run content:check-contract -- ${{ github.event.before }} ${{ github.sha }}

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build web app
        run: npm run build:web
        env:
          VITE_APP_ENV: staging
          VITE_SUPABASE_URL: https://example-stage.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
