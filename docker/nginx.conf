server {
    listen 5173;
    listen [::]:5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Missing assets must not be replaced with the app's HTML.
    location /assets/ {
        try_files $uri =404;
    }

    location = /usable-content.json {
        try_files $uri =404;
    }

    # React Router handles character and campaign URLs in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
