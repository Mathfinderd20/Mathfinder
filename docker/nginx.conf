server {
    listen 5173;
    listen [::]:5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Missing assets must not be replaced with the app's HTML.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /usable-content.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # React Router handles character and campaign URLs in the browser.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
